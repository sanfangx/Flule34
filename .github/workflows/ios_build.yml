name: Build iOS Unsigned IPA

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          brew install ldid
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>com.hanestl.flule34</string>
              <key>keychain-access-groups</key>
              <array>
                  <string>com.hanestl.flule34</string>
              </array>
          </dict>
          </plist>
          EOF
          
          ldid -Sentitlements.plist Payload/Runner.app/Runner
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec ldid -S {} \;
          
          zip -qq -r -9 Flule34_unsigned.ipa Payload
          rm -rf Payload entitlements.plist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flule34-iOS-Unsigned
          path: build/ios/iphoneos/Flule34_unsigned.ipa
